name: Build Kernel spes
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ARCH: "arm64"
      CC: "clang"
      LLVM: 1
      LLVM_IAS: 1
      CROSS_COMPILE: "aarch64-linux-gnu-"
      CROSS_COMPILE_ARM32: "arm-linux-gnueabi-"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y bison flex bc libssl-dev cpio lz4 xz-utils libelf-dev
          curl -LSsOJ https://github.com/qosq/toolchain-android/releases/download/clang-22/toolchain.tar.gz
          tar -xzf toolchain.tar.gz
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/gcc64/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/gcc32/bin" >> $GITHUB_PATH
          KBUILD_BUILD_HOST="abm-p-$(shuf -i 1000-9999 -n 1)"
      - name: Compile kernel
        run: |
          export KBUILD_BUILD_USER="android-build"
          export KBUILD_BUILD_HOST="abm-p-$(shuf -i 1000-9999 -n 1)"
          export KBUILD_BUILD_VERSION="1"
          make O=out vendor/spes-perf_defconfig
          scripts/kconfig/merge_config.sh -O out/ -m out/.config \
            arch/arm64/configs/vendor/debugfs.config
          make O=out olddefconfig
          make -j$(nproc) O=out Image.gz
      - name: Checkout anykernel
        uses: actions/checkout@v7
        with:
          repository: 'qosq/AnyKernel3'
          ref: 'spes'
          path: 'anykernel'
      - name: Copy kernel Image
        run: |
          cp ./out/arch/arm64/boot/Image.gz ./anykernel
          rm -f anykernel/README.md
      - name: Upload kernel
        uses: actions/upload-artifact@v7
        with:
          name: spes-4.19
          path: anykernel/
          compression-level: 9
          retention-days: 90
