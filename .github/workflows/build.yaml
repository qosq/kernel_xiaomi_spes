name: Build Kernel spes
run-name: "build-kernel · ${{ github.ref_name }}"
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ARCH: "arm64"
      CC: "clang"
      LLVM: 1
      LLVM_IAS: 1
      CROSS_COMPILE: "aarch64-linux-gnu-"
      CROSS_COMPILE_ARM32: "arm-linux-gnueabi-"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          submodules: true
      - name: Cache toolchain
        uses: actions/cache@v6
        with:
          path: |
            clang
            gcc64
            gcc32
          key: toolchain
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y bison flex bc libssl-dev cpio lz4 xz-utils libelf-dev
          if [[ ! -d clang ]]; then
            curl -LSsOJ --retry 3 https://github.com/qosq/toolchain-android/releases/download/clang-22/toolchain.tar.gz
            tar -xzf toolchain.tar.gz
            rm -f toolchain.tar.gz
          fi
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/gcc64/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/gcc32/bin" >> "$GITHUB_PATH"
      - name: Compile kernel
        run: |
          set -euo pipefail
          export KBUILD_BUILD_USER="android-build"
          export KBUILD_BUILD_HOST="abm-p-$(shuf -i 1000-9999 -n 1)"
          export KBUILD_BUILD_VERSION="1"
          make O=out vendor/spes-perf_defconfig
          scripts/kconfig/merge_config.sh -O out/ -m out/.config \
            arch/arm64/configs/vendor/debugfs.config
          make O=out olddefconfig
          make -j$(nproc) O=out Image.gz
      - name: Checkout anykernel
        uses: actions/checkout@v7
        with:
          repository: 'qosq/AnyKernel3'
          ref: 'spes'
          path: 'anykernel'
      - name: Copy kernel Image
        run: |
          set -euo pipefail
          cp ./out/arch/arm64/boot/Image.gz ./anykernel
          rm -f anykernel/README.md
      - name: Get Short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
      - name: Upload kernel
        uses: actions/upload-artifact@v7
        with:
          name: spes-4.19-${{ env.SHORT_SHA }}
          path: anykernel/
          compression-level: 9
          retention-days: 7
      - name: Upload defconfig
        uses: actions/upload-artifact@v7
        with:
          name: defconfig
          path: out/.config
          include-hidden-files: true
          archive: false
          retention-days: 7
      - name: Build summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## 🔨 Kernel Build Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Commit** | \`$(git rev-parse --short=7 HEAD)\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **Compiler** | \`$(clang --version 2>/dev/null | head -1 || echo 'N/A')\` |"
            if [[ -f ./out/arch/arm64/boot/Image.gz ]]; then
              echo "| **Image Size** | \`$(du -h ./out/arch/arm64/boot/Image.gz | cut -f1)\` |"
              echo "| **Status** | ✅ Success |"
            else
              echo "| **Image Size** | — |"
              echo "| **Status** | ❌ Failed |"
            fi
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
