name: CI
run-name: ci
on:
  workflow_dispatch:
    inputs:
      run_submodule:
        description: "Run KSU Update"
        required: true
        type: boolean
        default: true
      commit_hash_ksu:
        description: 'KSU full hash'
        type: string
      run_patch:
        description: "Run SUSFS Patch"
        required: true
        type: boolean
        default: false
      commit_hash_patch:
        description: 'Patch full hash'
        type: string
permissions:
  contents: write

jobs:

  update_submodule:
    if: ${{ inputs.run_submodule == true }}
    runs-on: ubuntu-slim
    outputs:
      status: ${{ steps.check.outputs.updated }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Update submodule to latest commit
        env:
          COMMIT_HASH: ${{ inputs.commit_hash_ksu }}
        id: check
        run: |
          git submodule update --init --remote
          if [[ -n "$COMMIT_HASH" ]]; then
            cd KernelSU/
            git switch "$COMMIT_HASH" --detach
            cd ..
          fi
          git add .
          if [[ -z $(git status -s) ]]; then
            echo "Nothing to commit."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and Push changes
        if: steps.check.outputs.updated == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -F - <<EOF
          bksu: update (https://github.com/Baka-SU/BakaSU/commit/$(git rev-parse HEAD:KernelSU))

          $(git diff --cached --submodule)
          EOF
          git push origin HEAD:${{ github.ref_name }}

  patch_susfs:
    runs-on: ubuntu-slim
    needs: update_submodule
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && inputs.run_patch == true
    env:
      PATCH_REPO: "JackA1ltman/NonGKI_Kernel_Build_2nd"
      PATCH_FILE: "Patches/Patch/susfs_patch_to_4.19.patch"
    outputs:
      status: ${{ steps.check.outputs.updated }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          submodules: true
          fetch-depth: 100
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y patchutils
      - name: Check for patch updates and download
        id: check
        env:
          NEW_HASH: ${{ inputs.commit_hash_patch }}
        run: |
          if [[ -z "$NEW_HASH" ]]; then
            NEW_HASH=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${PATCH_REPO}/commits?path=${PATCH_FILE}&per_page=1" | jq -r '.[0].sha')
          fi
          NEW_LINK="https://github.com/${PATCH_REPO}/commit/${NEW_HASH}"
          OLD_LINK=$(git log --grep="^susfs: patch" -n 1 --format="%s" | grep -oP '\(\K[^)]+')
          OLD_HASH=$(echo "$OLD_LINK" | grep -oP '/\K[^/]+$')
          if [ "$NEW_LINK" == "$OLD_LINK" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "new_link=$NEW_LINK" >> "$GITHUB_OUTPUT"
          curl -LSso old.patch "https://raw.githubusercontent.com/${PATCH_REPO}/${OLD_HASH}/${PATCH_FILE}"
          curl -LSso new.patch "https://raw.githubusercontent.com/${PATCH_REPO}/${NEW_HASH}/${PATCH_FILE}"
      - name: Interdiff and Apply
        if: steps.check.outputs.updated == 'true'
        run: |
          interdiff old.patch new.patch > diff.patch
          git apply --reject diff.patch
      - name: Commit and Push changes
        if: steps.check.outputs.updated == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "susfs: patch (${{ steps.check.outputs.new_link }})"
          git push origin HEAD:${{ github.ref_name }}

  build:
    needs: [update_submodule, patch_susfs]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.update_submodule.outputs.status == 'true' || needs.patch_susfs.outputs.status == 'true')
    uses: ./.github/workflows/build.yaml
