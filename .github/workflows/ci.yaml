name: CI
run-name: ci
on:
  workflow_dispatch:
    inputs:
      run_submodule:
        description: "Run KSU Update"
        required: true
        type: boolean
        default: false
permissions:
  contents: write

jobs:

  patch-susfs:
    runs-on: ubuntu-latest
    env:
      PATCH_REPO: "JackA1ltman/NonGKI_Kernel_Build_2nd"
      PATCH_FILE: "Patches/Patch/susfs_patch_to_4.19.patch"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 100
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y patchutils
      - name: Check for patch updates and download
        id: check
        run: |
          NEW_HASH=$(curl -fsSL "https://api.github.com/repos/${PATCH_REPO}/commits?path=${PATCH_FILE}&per_page=1" | jq -r '.[0].sha')
          NEW_LINK="https://github.com/${PATCH_REPO}/commit/${NEW_HASH}"
          OLD_LINK=$(git log --grep="^susfs: patch" -n 1 --format="%s" | grep -oP '\(\K[^)]+')
          OLD_HASH=$(echo "$OLD_LINK" | grep -oP '/\K[^/]+$')
          if [ "$NEW_LINK" == "$OLD_LINK" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "new_link=$NEW_LINK" >> "$GITHUB_OUTPUT"
          curl -LSso old.patch "https://raw.githubusercontent.com/${PATCH_REPO}/${OLD_HASH}/${PATCH_FILE}"
          curl -LSso new.patch "https://raw.githubusercontent.com/${PATCH_REPO}/${NEW_HASH}/${PATCH_FILE}"
      - name: Interdiff and Apply
        if: steps.check.outputs.updated == 'true'
        run: |
          interdiff old.patch new.patch > diff.patch
          git apply --reject diff.patch
      - name: Commit and Push changes
        if: steps.check.outputs.updated == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "susfs: patch (${{ steps.check.outputs.new_link }})"
          git push origin HEAD:${{ github.ref_name }}

  update-submodule:
    needs: patch-susfs
    if: ${{ inputs.run_submodule == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          submodules: recursive
          fetch-depth: 2
      - name: Update submodule to latest commit
        run: |
          git submodule update --remote --recursive
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if [[ -z $(git status -s) ]]; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -F - <<EOF
            bksu: update main branch to latest commit

            $(git diff --cached --submodule)
          EOF
          git push origin HEAD:${{ github.ref_name }}