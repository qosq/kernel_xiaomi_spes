name: 'Commit and Push'
description: 'Stage all changes, commit with the given message, and push'
inputs:
  message:
    description: 'Full commit message'
    required: true
  ref:
    description: 'Branch ref to push to'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Commit and Push
      shell: bash
      env:
        COMMIT_MSG: ${{ inputs.message }}
        TARGET_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        if [[ -z $(git status -s) ]]; then
          echo "::notice::Nothing to commit"
          exit 0
        fi
        git commit -m "$COMMIT_MSG"
        git push origin "HEAD:$TARGET_REF"
